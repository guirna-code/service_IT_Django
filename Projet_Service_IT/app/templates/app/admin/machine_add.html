{% extends 'app/base.html' %}
{% block title %}Ajouter Machine | ServiceIT{% endblock %}

{% block content %}
{% with role=user.role|default:"technician" %}
<style>
  .machine-form-page { color: var(--lux-text); }

  .form-shell {
    max-width: 900px;
    margin: 0 auto;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--lux-border);
    border-radius: 24px;
    padding: 28px;
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 40px rgba(0,0,0,0.22);
  }

  .form-title {
    font-size: 1.8rem;
    font-weight: 700;
    margin-bottom: 8px;
  }

  .form-subtitle {
    color: var(--lux-muted);
    margin-bottom: 24px;
  }

  .lux-label {
    font-weight: 600;
    margin-bottom: 8px;
    color: #f5f7ff;
  }

  .lux-input,
  .lux-select {
    background: rgba(255,255,255,0.06) !important;
    border: 1px solid rgba(255,255,255,0.08) !important;
    color: var(--lux-text) !important;
    border-radius: 16px !important;
    padding: 12px 14px !important;
  }

  .lux-select option {
    background: #17171d;
    color: white;
  }

  .lux-input:focus,
  .lux-select:focus {
    border-color: rgba(142,125,255,0.6) !important;
    box-shadow: 0 0 0 0.2rem rgba(142,125,255,0.14) !important;
  }

  .btn-lux-primary {
    background: linear-gradient(135deg, #8e7dff, #a99cff);
    color: white;
    border: none;
    border-radius: 999px;
    padding: 12px 24px;
    font-weight: 600;
  }

  .btn-lux-secondary {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--lux-border);
    color: var(--lux-text);
    border-radius: 999px;
    padding: 12px 24px;
    text-decoration: none;
    font-weight: 600;
  }

  .form-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    flex-wrap: wrap;
  }
</style>

<div class="machine-form-page">
  <div class="form-shell">
    <h1 class="form-title">Ajouter une machine</h1>
    <p class="form-subtitle">Ajoutez un nouvel équipement au parc informatique.</p>

    <form method="post">
      {% csrf_token %}

      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label lux-label">Nom de la machine</label>
          <input type="text" name="nom" class="form-control lux-input" required>
        </div>

        <div class="col-md-6">
          <label class="form-label lux-label">Numéro de série</label>
          <input type="text" name="numero_serie" class="form-control lux-input">
        </div>

        <div class="col-md-4">
          <label class="form-label lux-label">Type</label>
          <select name="type" class="form-select lux-select">
            <option value="PC">PC</option>
            <option value="SERVEUR">Serveur</option>
            <option value="IMPRIMANTE">Imprimante</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label lux-label">Pôle</label>
          <select name="pole" class="form-select lux-select">
            <option value="INF">Informatique</option>
            <option value="RH">Ressources Humaines</option>
            <option value="PROD">Production</option>
            <option value="MKT">Marketing</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label lux-label">État</label>
          <select name="etat" class="form-select lux-select">
            <option value="FONCTIONNEL">Fonctionnel</option>
            <option value="REPARATION">Réparation</option>
            <option value="EN_PANNE">En panne</option>
          </select>
        </div>

        <div class="col-md-6">
          <label class="form-label lux-label">Date d'acquisition</label>
          <input type="date" name="date_acquisition" class="form-control lux-input">
        </div>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-lux-primary">
          <i class="bi bi-plus-circle me-1"></i> Ajouter
        </button>

        <a href="{% url 'app:machine_list_admin' %}" class="btn-lux-secondary">
          Annuler
        </a>
      </div>
    </form>
  </div>
</div>
{% endwith %}
{% endblock %}
