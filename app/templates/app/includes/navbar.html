<header class="page-navbar px-3 px-md-4 py-3 d-flex align-items-center justify-content-between">
  <div class="d-flex align-items-center gap-3">
    <button
      class="btn navbar-toggle-btn d-lg-none"
      type="button"
      data-bs-toggle="offcanvas"
      data-bs-target="#sidebarCanvas"
      aria-controls="sidebarCanvas"
      aria-label="Ouvrir le menu"
    >
      <i class="bi bi-list"></i>
    </button>

    <div>
      <h1 class="h5 mb-0 fw-bold text-white">{{ page_title|default:"ServiceIT" }}</h1>
      <small class="navbar-subtitle">Gestion du parc informatique</small>
    </div>
  </div>

  <div class="d-flex align-items-center gap-3">
    <div class="d-none d-md-flex flex-column align-items-end">
      <span class="text-white small fw-semibold">{{ user.get_full_name|default:user.email }}</span>
      <span class="navbar-role">{{ user.role|default:"client" }}</span>
    </div>

    <a href="{% url 'app:logout' %}" class="btn btn-sm btn-outline-soft">
      <i class="bi bi-box-arrow-right me-1"></i> Deconnexion
    </a>
  </div>
</header>
