{% extends 'app/base.html' %}
{% block title %}Acces refuse | ServiceIT{% endblock %}

{% block content %}
<div class="confirm-card">
  <div class="page-header mb-0">
    <div>
      <h1 class="page-title">Acces refuse</h1>
      <p class="page-subtitle">Votre role ne permet pas d'ouvrir cette page.</p>
    </div>
    <form method="post" action="{% url 'app:logout' %}" class="m-0">
      {% csrf_token %}
      <button type="submit" class="btn btn-outline-soft">
        <i class="bi bi-box-arrow-right me-1"></i> Se deconnecter
      </button>
    </form>
  </div>
</div>
{% endblock %}
