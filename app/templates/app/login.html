{% extends 'app/base.html' %}
{% block title %}Connexion | ServiceIT{% endblock %}

{% block content %}
<div class="login-card">
  <div class="mb-4">
    <div class="metric-icon"><i class="bi bi-shield-lock"></i></div>
    <h1 class="page-title">Connexion</h1>
    <p class="page-subtitle">Connectez-vous avec votre email pour acceder a ServiceIT.</p>
  </div>

  <form method="post">
    {% csrf_token %}

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" name="email" class="form-control" placeholder="admin@example.com" required>
    </div>

    <div class="mb-4">
      <label for="password" class="form-label">Mot de passe</label>
      <input type="password" id="password" name="password" class="form-control" required>
    </div>

    <button type="submit" class="btn btn-primary w-100">
      <i class="bi bi-box-arrow-in-right me-1"></i> Se connecter
    </button>
  </form>
</div>
{% endblock %}
