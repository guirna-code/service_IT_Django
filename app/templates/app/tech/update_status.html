{% extends 'app/base.html' %}
{% block title %}Modifier l'etat | ServiceIT{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Modifier l'etat</h1>
    <p class="page-subtitle">{{ machine.nom }}</p>
  </div>
</div>

<form method="post" class="form-card">
  {% csrf_token %}

  {% if form.errors %}
    <div class="alert alert-danger">Veuillez choisir un etat valide.</div>
  {% endif %}

  <div class="mb-3">
    <label for="{{ form.etat.id_for_label }}" class="form-label">Etat</label>
    {{ form.etat }}
    {{ form.etat.errors }}
  </div>
  <div class="action-row">
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{% url 'app:machine_list_tech' %}" class="btn btn-outline-soft">Annuler</a>
  </div>
</form>
{% endblock %}
