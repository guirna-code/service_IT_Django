{% extends 'app/base.html' %}
{% block title %}Ajouter une intervention | ServiceIT{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Ajouter une intervention</h1>
    <p class="page-subtitle">Creer un rapport de maintenance, reparation ou installation.</p>
  </div>
</div>

<form method="post" class="form-card">
  {% csrf_token %}
  <div class="form-grid">
    <div>
      <label for="machine" class="form-label">Machine</label>
      <select id="machine" name="machine" class="form-select" required>
        <option value="">Selectionner une machine</option>
        {% for machine in machines %}
          <option value="{{ machine.id }}">{{ machine.nom }} - {{ machine.numero_serie|default:"Sans serie" }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="technicien" class="form-label">Technicien</label>
      <select id="technicien" name="technicien" class="form-select" required>
        <option value="">Selectionner un technicien</option>
        {% for technicien in techniciens %}
          <option value="{{ technicien.id }}" {% if user.id == technicien.id %}selected{% endif %}>
            {{ technicien.get_full_name|default:technicien.email }}
          </option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="type" class="form-label">Type</label>
      <select id="type" name="type" class="form-select" required>
        <option value="">Selectionner un type</option>
        {% for value,label in type_choices %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="statut" class="form-label">Statut</label>
      <select id="statut" name="statut" class="form-select" required>
        {% for value,label in statut_choices %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="date" class="form-label">Date</label>
      <input type="date" id="date" name="date" class="form-control" required>
    </div>
    <div>
      <label for="duree" class="form-label">Duree (minutes)</label>
      <input type="number" id="duree" name="duree" class="form-control" min="0" required>
    </div>
    <div class="form-span-2">
      <label for="description" class="form-label">Description</label>
      <textarea id="description" name="description" rows="5" class="form-control" required></textarea>
    </div>
  </div>

  <div class="action-row mt-4">
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{% url 'app:intervention_list' %}" class="btn btn-outline-soft">Annuler</a>
  </div>
</form>
{% endblock %}
