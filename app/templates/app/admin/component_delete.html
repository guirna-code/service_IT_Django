{% extends 'app/base.html' %}
{% block title %}Supprimer un composant | ServiceIT{% endblock %}

{% block content %}
<form method="post" class="confirm-card">
  {% csrf_token %}
  <h1 class="page-title">Supprimer le composant</h1>
  <p class="page-subtitle mb-4">Confirmez la suppression de <strong>{{ component.nom }}</strong>.</p>
  <div class="action-row">
    <button type="submit" class="btn btn-danger-soft">Supprimer</button>
    <a href="{% url 'app:component_list' %}" class="btn btn-outline-soft">Annuler</a>
  </div>
</form>
{% endblock %}
