{% extends 'app/base.html' %}
{% block title %}{{ page_title }} | ServiceIT{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">{{ page_title }}</h1>
    <p class="page-subtitle">Renseignez le nom, le type, l'etat et la machine.</p>
  </div>
</div>

<form method="post" class="form-card">
  {% csrf_token %}
  <div class="form-grid">
    <div>
      <label for="nom" class="form-label">Nom</label>
      <input type="text" id="nom" name="nom" class="form-control" value="{{ component.nom|default:'' }}" required>
    </div>
    <div>
      <label for="type" class="form-label">Type</label>
      <input type="text" id="type" name="type" class="form-control" value="{{ component.type|default:'' }}" placeholder="RAM, SSD, CPU">
    </div>
    <div>
      <label for="etat" class="form-label">Etat</label>
      <select id="etat" name="etat" class="form-select" required>
        {% for value,label in etat_choices %}
          <option value="{{ value }}" {% if component.etat == value %}selected{% endif %}>{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="machine" class="form-label">Machine</label>
      <select id="machine" name="machine" class="form-select" required>
        <option value="">Selectionner une machine</option>
        {% for machine in machines %}
          <option value="{{ machine.id }}" {% if component.machine.id == machine.id %}selected{% endif %}>
            {{ machine.nom }} - {{ machine.numero_serie|default:"Sans serie" }}
          </option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="action-row mt-4">
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{% url 'app:component_list' %}" class="btn btn-outline-soft">Annuler</a>
  </div>
</form>
{% endblock %}
