{% extends 'app/base.html' %}
{% block title %}Ajouter une machine | ServiceIT{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Ajouter une machine</h1>
    <p class="page-subtitle">Enregistrez un nouvel equipement dans le parc.</p>
  </div>
</div>

<form method="post" class="form-card">
  {% csrf_token %}
  <div class="form-grid">
    <div>
      <label for="nom" class="form-label">Nom</label>
      <input type="text" id="nom" name="nom" class="form-control" required>
    </div>
    <div>
      <label for="numero_serie" class="form-label">Numero de serie</label>
      <input type="text" id="numero_serie" name="numero_serie" class="form-control">
    </div>
    <div>
      <label for="type" class="form-label">Type</label>
      <select id="type" name="type" class="form-select">
        <option value="">Selectionner</option>
        {% for value,label in machine_type_choices %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="pole" class="form-label">Pole</label>
      <select id="pole" name="pole" class="form-select">
        {% for value,label in pole_choices %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label for="date_acquisition" class="form-label">Date d'acquisition</label>
      <input type="date" id="date_acquisition" name="date_acquisition" class="form-control">
    </div>
    <div>
      <label for="etat" class="form-label">Etat</label>
      <select id="etat" name="etat" class="form-select">
        {% for value,label in machine_etat_choices %}
          <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
  </div>

  <div class="action-row mt-4">
    <button type="submit" class="btn btn-primary">Enregistrer</button>
    <a href="{% url 'app:machine_list_admin' %}" class="btn btn-outline-soft">Annuler</a>
  </div>
</form>
{% endblock %}
